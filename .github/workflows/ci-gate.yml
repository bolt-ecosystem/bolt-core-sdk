name: CI Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # The SDK main branch is Rust/core-focused. TS package gates return if/when
  # TS packages are deliberately packaged back into this tree.
  # ---------------------------------------------------------------------------
  rust:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --check --all

      - name: cargo clippy (default features, deny warnings)
        run: cargo clippy --workspace -- -D warnings

      - name: cargo clippy (vectors feature, deny warnings)
        run: cargo clippy --workspace --features vectors -- -D warnings

      - name: cargo test (default features)
        run: cargo test --workspace

      - name: cargo test (vectors feature)
        run: cargo test --workspace --features vectors

  # ---------------------------------------------------------------------------
  # Summary gate — stable required-check name; fails if the suite failed
  # ---------------------------------------------------------------------------
  summary:
    name: CI Gate Summary
    needs:
      - rust
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Print suite results
        run: |
          echo "rust result: ${{ needs.rust.result }}"

      - name: Fail gate if the suite failed
        if: needs.rust.result != 'success'
        run: exit 1
